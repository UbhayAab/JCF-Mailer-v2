# Test profile.
#
# The point of the context test is not to exercise Postgres. It is that Spring Data
# validates every derived query name and every @Query JPQL statement at startup, and
# Hibernate builds the whole schema from the entities. So a context that boots proves
# the mappings, the repository method names and the JPQL all parse - which is exactly
# the class of mistake that otherwise only shows up on the box after a deploy.
#
# Native queries are not validated at startup, so the Postgres-specific SQL in
# CampaignRecipientRepository and JourneyParticipantRepository is not exercised here.
# Those are covered by running against the real database.

spring.datasource.url=jdbc:h2:mem:jcftest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false

# Nothing here should touch the network.
app.messagelog.stalwartLogEnabled=false
aws.region=ap-south-1
aws.ses.fromEmail=test@example.com
aws.ses.fromName=Test
aws.ses.replyTo=test@example.com
app.domain=http://localhost:8080

admin.email=test@example.com
admin.password=test-password-not-used
