<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>JCF Mailer | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="aurora-bg"><div class="aurora-blob-1"></div><div class="aurora-blob-2"></div></div>

    <div class="glass-panel p-5 animate-fade-up" style="width: 100%; max-width: 420px;">
        <h3 class="fw-bold text-center mb-4 text-gradient">Admin Login</h3>
        
        <div th:if="${error}" class="alert alert-danger" style="background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: #fca5a5;" th:text="${error}"></div>
        
        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="mailer@jarurat.care" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-premium w-100">Authenticate System</button>
        </form>
    </div>
</body>
</html>
