<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>JCF Campaign Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="aurora-bg"><div class="aurora-blob-1"></div><div class="aurora-blob-2"></div></div>

    <nav class="glass-panel m-3 d-flex justify-content-between align-items-center px-4 py-3 animate-fade-up">
        <h4 class="fw-bold mb-0 text-gradient">JCF Campaign Studio</h4>
        <div class="d-flex gap-3 align-items-center">
            <span style="color: var(--danger); font-size: 14px; font-weight: 600;">Bounces: <b th:text="${totalBounces}">0</b></span>
            <span style="color: var(--warning); font-size: 14px; font-weight: 600;">Unsubs: <b th:text="${totalUnsubscribed}">0</b></span>
            <a href="/logout" class="btn-glass" style="padding: 6px 16px; font-size: 13px;">Logout</a>
        </div>
    </nav>

    <div class="container-fluid px-4 mb-5">
        <div class="glass-panel mb-4 animate-fade-up delay-100">
            <div class="glass-header"><h6 class="mb-0 text-muted text-uppercase fw-bold">1. Select or Create Campaign</h6></div>
            <div class="glass-body d-flex gap-3">
                <select id="campaignSelect" class="form-select w-50" onchange="loadCampaign()">
                    <option value="">-- Create New Campaign --</option>
                    <option th:each="camp : ${campaigns}" th:value="${camp.name}" th:text="${camp.name}"></option>
                </select>
                <input type="text" id="campaignNameInput" class="form-control w-50" placeholder="New Campaign ID">
            </div>
        </div>

        <div class="row">
            <div class="col-lg-7 mb-4 animate-fade-up delay-200">
                <div class="glass-panel h-100">
                    <div class="glass-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0 text-muted text-uppercase fw-bold">2. Content & Audience</h6>
                        <!-- UPDATED: Shows you the exact Success Link to use -->
                        <small style="color: var(--text-muted); font-size:11px;">Success Link: &lt;a href="{{TRACK:https://mailer.horizonevent.info/api/mailer/success}}"&gt;</small>
                    </div>
                    <div class="glass-body">
                        <input type="text" id="subject" class="form-control mb-3" placeholder="Subject Line">
                        
                        <ul class="nav nav-tabs mb-3" style="border-bottom: 1px solid var(--glass-border);">
                            <li class="nav-item"><button class="nav-link active" style="background:transparent; color:#fff; border-color:var(--primary);" data-bs-toggle="tab" data-bs-target="#code">Code</button></li>
                            <li class="nav-item"><button class="nav-link" style="background:transparent; color:var(--text-muted); border:none;" data-bs-toggle="tab" data-bs-target="#preview" onclick="updatePreview()">Preview</button></li>
                        </ul>
                        
                        <div class="tab-content mb-4">
                            <div class="tab-pane fade show active" id="code">
                                <textarea id="htmlBody" class="form-control" rows="8" placeholder="Paste HTML here..."></textarea>
                            </div>
                            <div class="tab-pane fade" id="preview">
                                <iframe id="previewFrame" style="width:100%; height:210px; border:none; border-radius:8px; background:#fff;"></iframe>
                            </div>
                        </div>
                        
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <input class="form-control" type="file" id="csvFile" accept=".csv" style="max-width: 300px;">
                            <span id="campaignStats" style="color: var(--success); font-weight: 600; font-size: 14px;">Audience: 0 Ready | 0 Sent</span>
                        </div>

                        <div class="d-flex justify-content-between">
                            <button class="btn-glass" onclick="saveAndUpload()">Save & Upload CSV</button>
                            <button class="btn-premium" onclick="triggerCampaign()">Trigger Campaign</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-5 mb-4 animate-fade-up delay-300">
                <div class="glass-panel h-100 d-flex flex-column">
                    <div class="glass-header"><h6 class="mb-0 text-muted text-uppercase fw-bold">3. Analytics & Export</h6></div>
                    <div class="glass-body d-flex flex-column gap-3 flex-grow-1">
                        <button class="btn-glass w-100 text-start" onclick="exportCsv('CLICKED')">↓ Export Action Takers (CSV)</button>
                        <button class="btn-glass w-100 text-start" onclick="exportCsv('NO_ACTION')">↓ Export No Action (CSV)</button>
                        <div class="mt-auto pt-4 border-top" style="border-color: var(--glass-border) !important;">
                            <button class="btn-glass w-100" style="color: var(--danger); border-color: rgba(239, 68, 68, 0.3);" onclick="deleteCampaign()">Delete Campaign</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    function getActiveCampaign() { return document.getElementById('campaignSelect').value || document.getElementById('campaignNameInput').value; }
    function updatePreview() {
        let html = document.getElementById('htmlBody').value;
        html = html.replace(/{{NAME}}/g, "Dr. Smith").replace(/{{UNSUBSCRIBE_LINK}}/g, "#");
        document.getElementById('previewFrame').srcdoc = html;
    }
    async function loadCampaign() {
        let name = document.getElementById('campaignSelect').value;
        if(name) {
            document.getElementById('campaignNameInput').value = name;
            let res = await fetch('/api/campaign/' + encodeURIComponent(name));
            let data = await res.json();
            document.getElementById('subject').value = data.subject || "";
            document.getElementById('htmlBody').value = data.htmlBody || "";
            document.getElementById('campaignStats').innerText = `Audience: ${data.cleanCount} Ready | ${data.sentCount} Sent`;
            updatePreview();
        } else {
            document.getElementById('campaignNameInput').value = ""; document.getElementById('subject').value = ""; document.getElementById('htmlBody').value = "";
            document.getElementById('campaignStats').innerText = "Audience: 0 Ready | 0 Sent"; document.getElementById('previewFrame').srcdoc = "";
        }
    }
    async function saveAndUpload() {
        let name = getActiveCampaign();
        if(!name) return alert("Specify a Campaign ID.");
        let data = new URLSearchParams(); data.append("campaignName", name); data.append("subject", document.getElementById('subject').value); data.append("htmlBody", document.getElementById('htmlBody').value);
        await fetch('/template/save', { method: 'POST', body: data });
        const file = document.getElementById('csvFile').files[0];
        if (file) {
            let formData = new FormData(); formData.append("file", file); formData.append("campaignName", name);
            let uploadRes = await fetch('/api/mailer/contacts/upload', { method: 'POST', body: formData });
            alert(await uploadRes.text()); document.getElementById('csvFile').value = "";
        } else { alert("Template Saved!"); }
        loadCampaign(); 
    }
    
    // FIX: Completely refactored to send a proper POST Body. Prevents Nginx/Tomcat from dropping the request.
    async function triggerCampaign() {
        let name = getActiveCampaign();
        if(!name) return alert("Select a campaign!");
        if(confirm("Fire " + name + " to all Ready contacts?")) {
            let payload = new URLSearchParams(); 
            payload.append("campaignName", name);
            
            let res = await fetch('/api/mailer/trigger-campaign', { 
                method: 'POST',
                body: payload
            });
            
            alert(await res.text()); 
            loadCampaign(); 
        }
    }
    
    function exportCsv(type) {
        let name = getActiveCampaign();
        if(!name) return alert("Select a campaign first.");
        window.location.href = `/api/export?campaignName=${encodeURIComponent(name)}&type=${type}`;
    }
    async function deleteCampaign() {
        let name = getActiveCampaign();
        if(confirm(`Delete ${name}? Global suppressions remain safe.`)) {
            let data = new URLSearchParams(); data.append("campaignName", name);
            let res = await fetch('/api/campaign/delete', { method: 'POST', body: data });
            alert(await res.text()); location.reload(); 
        }
    }
</script>
</body>
</html>
